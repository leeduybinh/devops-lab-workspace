name: Mobile Security Scanning Pipeline

on:
  # 1. Scheduled cronjob run (every night at 12:00 AM UTC)
  schedule:
    - cron: '0 0 * * *'
  
  # 2. Trigger on Pull Requests to main
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - 'ios/**'
  
  # 3. Trigger on Releases
  release:
    types: [ published ]

  # 4. Manual trigger via GitHub UI for debugging and testing
  workflow_dispatch:
    inputs:
      build_env:
        description: 'Target Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  run-security-scans:
    name: Call Mobile Scan Reusable Workflow
    # Calls the local reusable scanning workflow
    uses: ./.github/workflows/devops-mobile-scan-cronjob.yml
    with:
      # Environment configuration (determines artifact naming)
      build_env: ${{ github.event.inputs.build_env || 'development' }}
      product_name: 'DevOps Mobile Scan Lab'
      product_type: 'Mobile'
      engagement_name: 'Security Scan - ${{ github.ref_name || github.head_ref }}'
      defectdojo_url: ${{ vars.DEFECTDOJO_URL || '' }}
      devops_elfie_gh_app_id: ${{ vars.DEVOPS_ELFIE_GH_APP_ID || '' }}
    secrets:
      defectdojo_api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
      devops_elfie_gh_app_key: ${{ secrets.DEVOPS_ELFIE_GH_APP_KEY }}
